# ---- Database (change the password to your own MySQL root password) ----
spring.config.import=optional:classpath:secret.properties
spring.datasource.url=jdbc:mysql://localhost:3306/roadresale?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=CHANGE_ME

# Run schema.sql every time the app starts (it only creates tables if missing)
spring.sql.init.mode=always

# ---- Photo uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# Reload HTML pages without restarting (handy while developing)
spring.thymeleaf.cache=false

# Remember logins with a cookie only (never put the session id in the address)
server.servlet.session.tracking-modes=cookie

# ---- Where photos are stored: "local" (uploads folder) or "s3" (AWS S3 bucket) ----
app.storage=local
# Only used when app.storage=s3
app.s3.bucket=your-bucket-name
app.s3.region=ap-south-1

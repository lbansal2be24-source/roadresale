<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${ad.id == 0 ? 'Sell a vehicle - RoadResale' : 'Edit ad - RoadResale'})}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>

<main class="container page narrow">
    <!-- ad.id is 0 for a new ad, and the real id when editing -->
    <h1 th:text="${ad.id == 0} ? 'Sell your vehicle' : 'Edit your ad'">Sell your vehicle</h1>
    <p class="muted" th:if="${ad.id == 0}">Buyers see these details on your ad. You can change them later.</p>
    <p class="alert alert-error" th:if="${error != null}" th:text="${error}">Error message</p>

    <!-- enctype is needed because this form uploads a file -->
    <form class="panel form" th:action="@{/ads/save}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${ad.id}">

        <h2>The vehicle</h2>
        <div class="row">
            <label>Type
                <select name="vehicleType" id="vehicleType" onchange="showExtraField()">
                    <option value="CAR" th:selected="${ad.vehicle.type == 'CAR'}">Car</option>
                    <option value="BIKE" th:selected="${ad.vehicle.type == 'BIKE'}">Bike</option>
                </select>
            </label>
            <label>Fuel
                <select name="fuelType">
                    <option th:selected="${ad.vehicle.fuelType == 'Petrol'}">Petrol</option>
                    <option th:selected="${ad.vehicle.fuelType == 'Diesel'}">Diesel</option>
                    <option th:selected="${ad.vehicle.fuelType == 'CNG'}">CNG</option>
                    <option th:selected="${ad.vehicle.fuelType == 'Electric'}">Electric</option>
                </select>
            </label>
        </div>
        <div class="row">
            <label>Brand
                <input type="text" name="brand" maxlength="60" required placeholder="Maruti" th:value="${ad.vehicle.brand}">
            </label>
            <label>Model
                <input type="text" name="model" maxlength="60" required placeholder="Swift" th:value="${ad.vehicle.model}">
            </label>
        </div>
        <div class="row">
            <label>Year
                <input type="number" name="year" min="1980" required placeholder="2019" th:value="${ad.vehicle.year > 0 ? ad.vehicle.year : ''}">
            </label>
            <label>Km driven
                <input type="number" name="kmDriven" min="0" required placeholder="42000" th:value="${ad.title != null ? ad.vehicle.kmDriven : ''}">
            </label>
        </div>
        <!-- Only one of these two is visible, depending on Car / Bike -->
        <div class="row">
            <label id="carField">Transmission
                <select name="transmission">
                    <option>Manual</option>
                    <option th:selected="${ad.vehicle.type == 'CAR' and ad.vehicle.transmission == 'Automatic'}">Automatic</option>
                </select>
            </label>
            <label id="bikeField">Engine (cc)
                <input type="number" name="engineCc" min="0" placeholder="150" th:value="${ad.vehicle.type == 'BIKE' ? ad.vehicle.engineCc : ''}">
            </label>
        </div>

        <h2>The ad</h2>
        <label>Title
            <input type="text" name="title" maxlength="150" required placeholder="Maruti Swift VXI 2019, single owner" th:value="${ad.title}">
        </label>
        <div class="row">
            <label>Price (₹)
                <input type="number" name="price" min="1" required placeholder="450000" th:value="${ad.price > 0 ? ad.price : ''}">
            </label>
            <label>City
                <input type="text" name="city" maxlength="80" required placeholder="Patiala" th:value="${ad.city}">
            </label>
        </div>
        <label>Description
            <textarea name="description" rows="4" placeholder="Condition, service history, reason for selling" th:text="${ad.description}"></textarea>
        </label>
        <label>Photo
            <input type="file" name="photo" accept=".jpg,.jpeg,.png">
            <span class="hint" th:text="${ad.id != 0} ? 'JPG or PNG, up to 5 MB. Leave empty to keep the current photo.' : 'JPG or PNG, up to 5 MB.'">JPG or PNG, up to 5 MB.</span>
        </label>

        <button class="btn btn-lane" type="submit" th:text="${ad.id == 0} ? 'Post ad' : 'Save changes'">Post ad</button>
    </form>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

<script>
    // Show "Transmission" for cars and "Engine (cc)" for bikes.
    function showExtraField() {
        var isBike = document.getElementById("vehicleType").value === "BIKE";
        document.getElementById("carField").style.display = isBike ? "none" : "block";
        document.getElementById("bikeField").style.display = isBike ? "block" : "none";
    }
    showExtraField();
</script>
</body>
</html>
